name=ReflectINI
version=1.0.0
author=Michael michi.fu@quickline.ch
maintainer=Michael michi.fu@quickline.ch
sentence=INI writer and reader for microcontrollers with struct reflection (REFLECT/MEMBER), sections, arrays and precise error locations.
paragraph=Write and read C++ structs as INI files without hand-written parsing code. Nested structs become [sections], arrays become lists, std::optional and const char* are nullable. Parses from const char* (optional zero-copy), no heap use while reading or writing, error path / line / column. Shares ReflectCore.h with ReflectJSON (same struct for JSON and INI), but does not require it. Needs C++17 (RP2040/RP2350, ESP32, Teensy 4.x, Arduino UNO R4). Free for noncommercial use; commercial use requires a license.
category=Data Processing
url=https://github.com/Michael-0-sys/ReflectINI
architectures=rp2040,esp32,teensy,renesas_uno
includes=ReflectINI.h
